<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YHealth</title><style>:root{--bg:#f6f7f9;--card:#fff;--text:#17191c;--muted:#747b85;--line:#e7e9ed;--diet:#1f9d67;--sport:#ef8f3c;--sleep:#6c63ff;--period:#e35d7a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:980px;margin:auto;padding:26px 18px 60px;position:relative}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}h1{margin:0;font-size:30px}header p{margin:6px 0 0;color:var(--muted);font-size:14px}.datewrap{position:relative}.datebtn,.badge{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13px;cursor:pointer}.calendar{display:none;position:absolute;right:0;top:46px;width:330px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 16px 45px rgba(20,25,35,.15);z-index:20}.calendar.on{display:block}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.dow{font-size:11px;color:var(--muted);padding:5px}.day{height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;position:relative;cursor:pointer}.day.empty{cursor:default}.day.periodday{background:#fff0f4;color:#b83f5e;font-weight:700}.day.selected{outline:2px solid #17191c}.day.periodday:after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--period)}.legend{font-size:12px;color:var(--muted);margin-top:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tab{border:0;border-radius:12px;padding:10px 16px;background:#e9ebef;font-weight:650;color:#59606a;cursor:pointer}.tab.on{background:#17191c;color:#fff}.page{display:none}.page.on{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.k,.label,.note{color:var(--muted)}.k{font-size:12px}.big{font-size:34px;font-weight:760;margin-top:6px}.big small{font-size:15px;color:var(--muted);font-weight:500}.label{font-size:13px;margin-top:5px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.head h2{font-size:18px;margin:0}.food,.event{display:grid;grid-template-columns:76px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.event{grid-template-columns:80px 1fr}.time,.foodname,.kcal{font-weight:700}.meta,.note{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.55}.period{background:#fff8fa;border-color:#f3d7df}.sport{background:#fffaf5;border-color:#f4dfca}table{width:100%;border-collapse:collapse}td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}td:last-child,th:last-child{text-align:right}.coach{padding:12px 0;border-bottom:1px solid var(--line)}.trend svg{width:100%;height:auto;display:block}.trendleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}footer{text-align:center;color:#9aa0a8;font-size:12px;margin-top:26px}@media(max-width:700px){.s8,.s6,.s4{grid-column:span 12}header{align-items:start}.food{grid-template-columns:58px 1fr auto}.calendar{position:fixed;left:16px;right:16px;top:80px;width:auto}}</style></head><body><div class="app"><header><div><h1>YHealth</h1><p>饮食 · 睡眠 · 运动 · 身体状态</p></div><div class="datewrap"><button class="datebtn" id="dateBtn"></button><div class="calendar" id="calendar"><div class="calhead"><b>2026 年 8 月</b><span style="color:var(--muted);font-size:12px">月经 8/14–8/18</span></div><div class="calgrid" id="calgrid"></div><div class="legend"><span class="dot" style="background:var(--period)"></span>粉色 = 月经期；黑框 = 当前查看日期</div></div></div></header><nav class="tabs"><button class="tab on" data-p="overview">综合</button><button class="tab" data-p="diet">饮食</button><button class="tab" data-p="sleep">睡眠</button><button class="tab" data-p="sport">运动</button><button class="tab" data-p="body">身体</button></nav><section id="overview" class="page on"></section><section id="diet" class="page"></section><section id="sleep" class="page"></section><section id="sport" class="page"></section><section id="body" class="page"></section><footer id="footer"></footer></div><script>
const D={18:{date:'2026 年 8 月 18 日',intakeMid:2300,intakeText:'≈2180–2420',burn:774,sleepH:8.07,sleepText:'8h04m',sleepDetail:'00:32 → 08:36 · 效率94%',foods:[['≈10:00','黑咖啡 + 无油面饼30g','≈87 kcal'],['≈13:28','午餐：松板肉170g + 米饭 + 山药 + 卷心菜 + 橄榄油 + 水煮蛋1个','≈921 kcal'],['16:42','水煮鸡蛋1个','≈73 kcal'],['18:37','全脂纯牛奶200mL','≈140 kcal'],['22:34','西瓜半个，基本吃完','≈360–450 kcal'],['22:35','鸡肉餐：带皮鸡肉 + 香肠1根 + 炸翅根1个 + 番茄酱','≈600–750 kcal']],sleepRows:[['深睡','2h36m','32%'],['浅睡','3h27m','43%'],['REM','2h01m','25%']],sport:'<div class="card s4 sport"><div class="k">全天动态消耗</div><div class="big">774 <small>kcal</small></div></div><div class="card s4"><div class="k">步数</div><div class="big">6077 <small>步</small></div><div class="label">活动32分钟 · 站立13小时</div></div><div class="card s4"><div class="k">Zumba</div><div class="big">198 <small>kcal</small></div><div class="label">39分28秒 · 平均125 · 最高155 BPM</div></div>',body:'<div class="card s4 period"><div class="k">月经</div><div class="big">Day 5</div><div class="label">8/14开始 · 8/18结束</div></div><div class="card s4"><div class="k">排便</div><div class="big">3<small>次</small></div><div class="label">其中腹泻2次</div></div><div class="card s4"><div class="k">状态</div><div class="big">经期结束</div></div>',note:'晚间出现2次腹泻；晚间西瓜和鸡肉餐均为照片估算。'},19:{date:'2026 年 8 月 19 日',intakeMid:1376,intakeText:'≈1376',burn:null,sleepH:6.68,sleepText:'6h41m',sleepDetail:'01:35 → 08:16 · 效率97%',foods:[['≈09:30','白馒头130g','≈393 kcal'],['≈09:30','黑咖啡1杯','≈3 kcal'],['14:31','白馒头1个（约130g）','≈393 kcal'],['14:31','洋葱1个','≈40 kcal'],['14:31','泰式松板肉1块（暂按170g）','≈547 kcal']],sleepRows:[['深睡','2h13m','33%'],['浅睡','2h47m','42%'],['REM','1h41m','25%']],sport:'<div class="card s4 sport"><div class="k">Zumba运动热量</div><div class="big">208 <small>kcal</small></div><div class="label">12:27 · 41分31秒</div></div><div class="card s4"><div class="k">平均 / 最高心率</div><div class="big">135 <small>/166 BPM</small></div></div><div class="card s4"><div class="k">全天动态消耗</div><div class="big">—</div><div class="label">等待晚间全天数据</div></div>',body:'<div class="card s4"><div class="k">月经</div><div class="big">已结束</div><div class="label">本次8/14–8/18</div></div><div class="card s4"><div class="k">今日排便</div><div class="big">1<small>次</small></div><div class="label">10:24 · 絮状不成型 · 红色</div></div><div class="card s4"><div class="k">观察</div><div class="big">继续记录</div><div class="label">前晚大量西瓜，暂观察颜色变化</div></div>',note:'睡眠效率高但时长偏短；今天Zumba强度高于昨天；继续观察红色不成型便。'}};
let sel=19;
function chart(){const w=860,h=260,l=56,r=48,t=22,b=42,iw=w-l-r,ih=h-t-b,x18=l+iw*.28,x19=l+iw*.72;const maxK=2600,maxS=10,yk=v=>t+ih-(v/maxK)*ih,ys=v=>t+ih-(v/maxS)*ih;let s=`<svg viewBox="0 0 ${w} ${h}"><rect x="${l}" y="${t}" width="${iw}" height="${ih}" rx="14" fill="#fafbfc"/>`;for(let i=0;i<=5;i++){let y=t+ih*i/5;s+=`<line x1="${l}" y1="${y}" x2="${l+iw}" y2="${y}" stroke="#e7e9ed"/>`}s+=`<polyline fill="none" stroke="#1f9d67" stroke-width="3" points="${x18},${yk(2300)} ${x19},${yk(1376)}"/><circle cx="${x18}" cy="${yk(2300)}" r="5" fill="#1f9d67"/><circle cx="${x19}" cy="${yk(1376)}" r="5" fill="#1f9d67"/><circle cx="${x18}" cy="${yk(774)}" r="5" fill="#ef8f3c"/><circle cx="${x18}" cy="${ys(8.07)}" r="5" fill="#6c63ff"/><circle cx="${x19}" cy="${ys(6.68)}" r="5" fill="#6c63ff"/><text x="${x18}" y="${h-14}" text-anchor="middle" font-size="12">8/18</text><text x="${x19}" y="${h-14}" text-anchor="middle" font-size="12">8/19</text></svg>`;return s}
function render(){const d=D[sel];document.getElementById('dateBtn').textContent=d.date+' ▾';document.querySelectorAll('.day[data-d]').forEach(x=>x.classList.toggle('selected',+x.dataset.d===sel));document.getElementById('overview').innerHTML=`<div class="grid"><div class="card s12 trend"><div class="head"><div><h2>综合趋势</h2><div class="label">横轴日期 · 摄入/动态消耗 kcal · 睡眠时长</div></div><span class="badge">持续更新</span></div>${chart()}<div class="trendleg"><span><i class="dot" style="background:var(--diet)"></i>摄入</span><span><i class="dot" style="background:var(--sport)"></i>动态消耗</span><span><i class="dot" style="background:var(--sleep)"></i>睡眠</span></div></div><div class="card s4"><div class="k">${sel===19?'今日':'当日'}摄入</div><div class="big">${d.intakeText} <small>kcal</small></div></div><div class="card s4 sport"><div class="k">${sel===19?'今日':'当日'}动态消耗</div><div class="big">${d.burn??'—'} <small>${d.burn?'kcal':''}</small></div><div class="label">${d.burn?'全天数据':'等待全天数据'}</div></div><div class="card s4"><div class="k">睡眠</div><div class="big">${d.sleepText}</div><div class="label">${d.sleepDetail}</div></div><div class="card s12"><div class="head"><h2>健康师观察</h2></div><div class="note">${d.note}</div></div></div>`;document.getElementById('diet').innerHTML=`<div class="grid"><div class="card s12"><div class="head"><h2>8 月 ${sel} 日 · 饮食记录</h2><span class="badge">${d.intakeText} kcal</span></div>${d.foods.map(f=>`<div class="food"><div class="time">${f[0]}</div><div><div class="foodname">${f[1]}</div></div><div class="kcal">${f[2]}</div></div>`).join('')}</div></div>`;document.getElementById('sleep').innerHTML=`<div class="grid"><div class="card s4"><div class="k">实际睡眠</div><div class="big">${d.sleepText}</div><div class="label">${d.sleepDetail}</div></div><div class="card s8"><table><tr><th>阶段</th><th>时长</th><th>占比</th></tr>${d.sleepRows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div></div>`;document.getElementById('sport').innerHTML=`<div class="grid">${d.sport}</div>`;document.getElementById('body').innerHTML=`<div class="grid">${d.body}</div>`;document.getElementById('footer').textContent=`当前查看：${d.date}`}
const cg=document.getElementById('calgrid');['日','一','二','三','四','五','六'].forEach(x=>cg.innerHTML+=`<div class="dow">${x}</div>`);for(let i=0;i<6;i++)cg.innerHTML+='<div class="day empty"></div>';for(let d=1;d<=31;d++){let c='day'+(d>=14&&d<=18?' periodday':'');cg.innerHTML+=`<div class="${c}" data-d="${d}">${d}</div>`}cg.addEventListener('click',e=>{const n=+e.target.dataset.d;if(D[n]){sel=n;render();document.getElementById('calendar').classList.remove('on')}});document.getElementById('dateBtn').onclick=e=>{e.stopPropagation();document.getElementById('calendar').classList.toggle('on')};document.getElementById('calendar').onclick=e=>e.stopPropagation();document.addEventListener('click',()=>document.getElementById('calendar').classList.remove('on'));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.p).classList.add('on')});render();
</script></body></html>
