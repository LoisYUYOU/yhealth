<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YHealth</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#17191c;--muted:#747b85;--line:#e7e9ed;--diet:#1f9d67;--sport:#ef8f3c;--sleep:#6c63ff;--period:#e35d7a;--body:#2aa6a1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:980px;margin:auto;padding:26px 18px 60px;position:relative}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}h1{margin:0;font-size:30px}header p{margin:6px 0 0;color:var(--muted);font-size:14px}.datewrap{position:relative}.datebtn,.badge{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13px;cursor:pointer}.calendar{display:none;position:absolute;right:0;top:46px;width:330px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 16px 45px rgba(20,25,35,.15);z-index:20}.calendar.on{display:block}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.dow{font-size:11px;color:var(--muted);padding:5px}.day{height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;position:relative;cursor:pointer}.day.empty{cursor:default}.day.periodday{background:#fff0f4;color:#b83f5e;font-weight:700}.day.selected{outline:2px solid #17191c}.day.periodday:after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--period)}.legend{font-size:12px;color:var(--muted);margin-top:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tab{border:0;border-radius:12px;padding:10px 16px;background:#e9ebef;font-weight:650;color:#59606a;cursor:pointer}.tab.on{background:#17191c;color:#fff}.page{display:none}.page.on{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.k,.label,.note{color:var(--muted)}.k{font-size:12px}.big{font-size:30px;font-weight:760;margin-top:6px}.big small{font-size:14px;color:var(--muted);font-weight:500}.label{font-size:13px;margin-top:5px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.head h2{font-size:18px;margin:0}.food,.event{display:grid;grid-template-columns:76px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.event{grid-template-columns:80px 1fr}.time,.foodname,.kcal{font-weight:700}.meta,.note{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.55}.period{background:#fff8fa;border-color:#f3d7df}.sport{background:#fffaf5;border-color:#f4dfca}.bodycard{background:#f5fffe;border-color:#cce9e6}.metricrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.metric b{font-size:22px;display:block;margin-top:4px}.weighttrend{margin-top:12px}.weighttrend svg{width:100%;height:auto;display:block}table{width:100%;border-collapse:collapse}td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}td:last-child,th:last-child{text-align:right}.coach{padding:12px 0;border-bottom:1px solid var(--line)}.trend{padding:18px 18px 16px}.trend .head{margin-bottom:4px}.trend .head h2{font-size:17px}.trend-sub{font-size:12px;color:var(--muted);margin-top:4px}.trend svg{width:100%;height:auto;display:block;margin-top:4px}.trendleg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}.axis-note{font-size:10px;fill:#8a9098}.summary-grid .big{font-size:28px}footer{text-align:center;color:#9aa0a8;font-size:12px;margin-top:26px}@media(max-width:700px){.s8,.s6,.s4{grid-column:span 12}header{align-items:start}.food{grid-template-columns:58px 1fr auto}.calendar{position:fixed;left:16px;right:16px;top:80px;width:auto}.trend{padding:16px 14px 14px}.trend .head{display:block}.trend .head h2{font-size:17px}.trend-sub{white-space:nowrap;font-size:11px}.trend svg{margin-top:0}.summary-grid .card{padding:18px}.summary-grid .big{font-size:27px}.metricrow{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app"><header><div><h1>YHealth</h1><p>饮食 · 睡眠 · 运动 · 身体状态</p></div><div class="datewrap"><button class="datebtn" id="dateBtn"></button><div class="calendar" id="calendar"><div class="calhead"><b>2026 年 8 月</b><span id="periodText" style="color:var(--muted);font-size:12px"></span></div><div class="calgrid" id="calgrid"></div><div class="legend"><span class="dot" style="background:var(--period)"></span>粉色 = 月经期；黑框 = 当前查看日期</div></div></div></header><nav class="tabs"><button class="tab on" data-p="overview">综合</button><button class="tab" data-p="diet">饮食</button><button class="tab" data-p="sleep">睡眠</button><button class="tab" data-p="sport">运动</button><button class="tab" data-p="body">身体</button></nav><section id="overview" class="page on"></section><section id="diet" class="page"></section><section id="sleep" class="page"></section><section id="sport" class="page"></section><section id="body" class="page"></section><footer id="footer"></footer></div>
<script>
let profile=null,currentDate=null,currentData=null,allData={};
const fmtMin=m=>m==null?'—':`${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}m`;
const val=(x,suffix='')=>x==null?'—':`${x}${suffix}`;
async function loadProfile(){profile=await fetch('data/profile.json?ts='+Date.now()).then(r=>r.json());for(const d of profile.available_dates){allData[d]=await fetch(`data/${d}.json?ts=${Date.now()}`).then(r=>r.json())}}
function inPeriod(date){return profile.menstrual_cycles.some(c=>date>=c.start&&date<=c.end)}
function buildCalendar(){const cg=document.getElementById('calgrid');cg.innerHTML='';['日','一','二','三','四','五','六'].forEach(x=>cg.innerHTML+=`<div class="dow">${x}</div>`);for(let i=0;i<6;i++)cg.innerHTML+='<div class="day empty"></div>';for(let d=1;d<=31;d++){const ds=`2026-08-${String(d).padStart(2,'0')}`,classes=['day'];if(inPeriod(ds))classes.push('periodday');if(ds===currentDate)classes.push('selected');const enabled=profile.available_dates.includes(ds);cg.innerHTML+=`<div class="${classes.join(' ')}" data-date="${enabled?ds:''}" style="${enabled?'':'opacity:.35;cursor:default'}">${d}</div>`}const c=profile.menstrual_cycles[0];document.getElementById('periodText').textContent=c?`月经 ${c.start.slice(5).replace('-','/')}–${c.end.slice(5).replace('-','/')}`:''}
function chart(){const dates=profile.available_dates,w=860,h=310,l=70,r=66,t=24,b=48,iw=w-l-r,ih=h-t-b;const kcalVals=[];dates.forEach(d=>{const a=allData[d];if(a.intake?.kcal_mid!=null)kcalVals.push(a.intake.kcal_mid);if(a.activity?.dynamic_kcal!=null)kcalVals.push(a.activity.dynamic_kcal)});const rawMax=Math.max(1000,...kcalVals),maxK=Math.ceil(rawMax/500)*500,maxS=10,yk=v=>t+ih-(v/maxK)*ih,ys=v=>t+ih-(v/maxS)*ih,x=i=>dates.length===1?l+iw/2:l+iw*(.08+.84*i/(dates.length-1));let s=`<svg viewBox="0 0 ${w} ${h}"><rect x="${l}" y="${t}" width="${iw}" height="${ih}" rx="12" fill="#fafbfc"/>`;for(let i=0;i<=4;i++){const y=t+ih*i/4,k=Math.round(maxK*(1-i/4)),hrs=Math.round(maxS*(1-i/4)*10)/10;s+=`<line x1="${l}" y1="${y}" x2="${l+iw}" y2="${y}" stroke="#e7e9ed"/><text x="${l-10}" y="${y+4}" text-anchor="end" class="axis-note">${k}</text><text x="${l+iw+10}" y="${y+4}" text-anchor="start" class="axis-note">${hrs}h</text>`}s+=`<text x="${l}" y="13" class="axis-note">kcal</text><text x="${l+iw}" y="13" text-anchor="end" class="axis-note">睡眠</text>`;const series=(getter,yfn,color)=>{let cur=[];dates.forEach((d,i)=>{const v=getter(allData[d]);if(v!=null)cur.push([x(i),yfn(v)])});if(cur.length>1)s+=`<polyline fill="none" stroke="${color}" stroke-width="3" points="${cur.map(p=>p.join(',')).join(' ')}"/>`;cur.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${color}" stroke="#fff" stroke-width="2"/>`)};series(a=>a.intake?.kcal_mid,yk,'#1f9d67');series(a=>a.activity?.dynamic_kcal,yk,'#ef8f3c');series(a=>a.sleep?.duration_minutes!=null?a.sleep.duration_minutes/60:null,ys,'#6c63ff');dates.forEach((d,i)=>s+=`<text x="${x(i)}" y="${h-16}" text-anchor="middle" font-size="11" fill="#747b85">${d.slice(5).replace('-','/')}</text>`);return s+'</svg>'}
function weightChart(){const pts=profile.available_dates.map(d=>({d,w:allData[d]?.body?.composition?.weight_kg})).filter(x=>x.w!=null);if(!pts.length)return '<div class="note">暂无体重趋势数据</div>';const w=860,h=220,l=58,r=24,t=18,b=38,iw=w-l-r,ih=h-t-b,min=Math.floor((Math.min(...pts.map(x=>x.w))-.5)*2)/2,max=Math.ceil((Math.max(...pts.map(x=>x.w))+.5)*2)/2,span=Math.max(.5,max-min),x=i=>pts.length===1?l+iw/2:l+iw*i/(pts.length-1),y=v=>t+ih-(v-min)/span*ih;let s=`<svg viewBox="0 0 ${w} ${h}"><rect x="${l}" y="${t}" width="${iw}" height="${ih}" rx="12" fill="#fafbfc"/>`;for(let i=0;i<=3;i++){const yy=t+ih*i/3,v=(max-span*i/3).toFixed(1);s+=`<line x1="${l}" y1="${yy}" x2="${l+iw}" y2="${yy}" stroke="#e7e9ed"/><text x="${l-8}" y="${yy+4}" text-anchor="end" class="axis-note">${v}</text>`}if(pts.length>1)s+=`<polyline fill="none" stroke="#2aa6a1" stroke-width="3" points="${pts.map((p,i)=>`${x(i)},${y(p.w)}`).join(' ')}"/>`;pts.forEach((p,i)=>s+=`<circle cx="${x(i)}" cy="${y(p.w)}" r="5" fill="#2aa6a1" stroke="#fff" stroke-width="2"/><text x="${x(i)}" y="${h-14}" text-anchor="middle" font-size="11" fill="#747b85">${p.d.slice(5).replace('-','/')}</text>`);return s+'</svg>'}
function intakeText(d){const i=d.intake||{};if(i.kcal_min==null&&i.kcal_max==null)return '—';return i.kcal_min===i.kcal_max?`≈${i.kcal_mid}`:`≈${i.kcal_min}–${i.kcal_max}`}
function render(){const d=currentData,dt=new Date(d.date+'T00:00:00'),md=`${dt.getMonth()+1} 月 ${dt.getDate()} 日`,sleep=d.sleep||{},activity=d.activity||{},diet=d.diet||[],exercise=d.exercise||[],body=d.body||{},composition=body.composition||null,bms=body.bowel_movements||[];document.getElementById('dateBtn').textContent=`${dt.getFullYear()} 年 ${dt.getMonth()+1} 月 ${dt.getDate()} 日 ▾`;buildCalendar();document.getElementById('overview').innerHTML=`<div class="grid summary-grid"><div class="card s12 trend"><div class="head"><div><h2>综合趋势</h2><div class="trend-sub">摄入 / 动态消耗（kcal） · 睡眠（小时）</div></div></div>${chart()}</div><div class="card s4"><div class="k">当日摄入</div><div class="big">${intakeText(d)} <small>${d.intake?.kcal_mid!=null?'kcal':''}</small></div></div><div class="card s4 sport"><div class="k">全天动态消耗</div><div class="big">${val(activity.dynamic_kcal)} <small>${activity.dynamic_kcal!=null?'kcal':''}</small></div></div><div class="card s4"><div class="k">睡眠</div><div class="big">${fmtMin(sleep.duration_minutes)}</div><div class="label">效率${val(sleep.efficiency_percent,'%')}</div></div><div class="card s4 bodycard"><div class="k">体重</div><div class="big">${composition?.weight_kg!=null?composition.weight_kg.toFixed(2):'—'} <small>${composition?.weight_kg!=null?'kg':''}</small></div><div class="label">${composition?.time?`测量 ${composition.time}`:'暂无当日体重'}</div></div><div class="card s12"><div class="head"><h2>健康师观察</h2></div>${(d.coach_notes||[]).map(n=>`<div class="coach"><div class="note">${n}</div></div>`).join('')}</div></div>`;document.getElementById('diet').innerHTML=`<div class="grid"><div class="card s12"><div class="head"><h2>${md} · 饮食记录</h2><span class="badge">${intakeText(d)} kcal</span></div>${diet.length?diet.map(f=>`<div class="food"><div class="time">${f.time??'—'}</div><div><div class="foodname">${f.name??'未命名'}</div>${f.meta?`<div class="meta">${f.meta}</div>`:''}</div><div class="kcal">${f.kcal_text??'—'}</div></div>`).join(''):'<div class="note">暂无饮食记录</div>'}</div></div>`;document.getElementById('sleep').innerHTML=`<div class="grid"><div class="card s4"><div class="k">实际睡眠</div><div class="big">${fmtMin(sleep.duration_minutes)}</div></div><div class="card s4"><div class="k">睡眠效率</div><div class="big">${val(sleep.efficiency_percent)}<small>${sleep.efficiency_percent!=null?'%':''}</small></div></div><div class="card s4"><div class="k">清醒时长</div><div class="big">${val(sleep.awake_minutes)}<small>${sleep.awake_minutes!=null?'分':''}</small></div></div><div class="card s12"><table><tr><th>阶段</th><th>时长</th><th>占比</th></tr>${(sleep.stages||[]).map(r=>`<tr><td>${r.name}</td><td>${fmtMin(r.minutes)}</td><td>${val(r.percent,'%')}</td></tr>`).join('')}</table></div></div>`;document.getElementById('sport').innerHTML=`<div class="grid">${activity.dynamic_kcal!=null?`<div class="card s4 sport"><div class="k">全天动态消耗</div><div class="big">${activity.dynamic_kcal}<small> kcal</small></div></div>`:''}${activity.steps!=null?`<div class="card s4"><div class="k">步数</div><div class="big">${activity.steps}<small> 步</small></div><div class="label">活动${activity.active_minutes??'—'}分钟 · 站立${activity.stand_hours??'—'}小时</div></div>`:''}${exercise.length?exercise.map(e=>`<div class="card s4"><div class="k">${e.name??e.type??'运动'}</div><div class="big">${e.active_kcal??'—'}<small>${e.active_kcal!=null?' kcal':''}</small></div><div class="label">${e.time??'—'} · ${e.duration??'—'} · 平均${e.avg_hr_bpm??e.avg_hr??'—'} / 最高${e.max_hr_bpm??e.max_hr??'—'} BPM</div></div>`).join(''):'<div class="card s12"><div class="note">暂无专项运动记录</div></div>'}</div>`;document.getElementById('body').innerHTML=`<div class="grid"><div class="card s12 bodycard"><div class="head"><div><h2>体重专项</h2><div class="trend-sub">体重与身体成分</div></div>${composition?.time?`<span class="badge">${composition.time}</span>`:''}</div>${composition?`<div class="big">${composition.weight_kg!=null?composition.weight_kg.toFixed(2):'—'} <small>${composition.weight_kg!=null?'kg':''}</small></div><div class="metricrow"><div class="metric"><div class="k">BMI</div><b>${val(composition.bmi)}</b></div><div class="metric"><div class="k">体脂率</div><b>${val(composition.body_fat_percent,composition.body_fat_percent!=null?'%':'')}</b></div><div class="metric"><div class="k">肌肉量</div><b>${val(composition.muscle_mass,composition.muscle_mass!=null?' kg':'')}</b></div></div>${composition.notes?`<div class="note" style="margin-top:14px">${composition.notes}</div>`:''}`:'<div class="note">当天暂无体重/身体成分记录</div>'}</div><div class="card s12 weighttrend"><div class="head"><h2>体重趋势</h2><span class="badge">kg</span></div>${weightChart()}</div><div class="card s6 period"><div class="k">月经</div><div class="big">${inPeriod(d.date)?'经期':'已结束'}</div><div class="label">${profile.menstrual_cycles[0]?`${profile.menstrual_cycles[0].start.slice(5).replace('-','/')} → ${profile.menstrual_cycles[0].end.slice(5).replace('-','/')}`:'—'}</div></div><div class="card s6"><div class="k">排便</div><div class="big">${bms.length}<small>次</small></div>${bms.length?bms.map(x=>`<div class="event"><div class="time">${x.time??'—'}</div><div>${x.description??'—'}</div></div>`).join(''):'<div class="note">暂无排便记录</div>'}</div></div>`;document.getElementById('footer').textContent=`当前查看：${d.date} · 页面结构与每日数据已分离`}
async function selectDate(date){if(!profile.available_dates.includes(date))return;currentDate=date;currentData=allData[date];render();document.getElementById('calendar').classList.remove('on')}
const cal=document.getElementById('calendar');document.getElementById('calgrid').addEventListener('click',e=>{if(e.target.dataset.date)selectDate(e.target.dataset.date)});document.getElementById('dateBtn').onclick=e=>{e.stopPropagation();cal.classList.toggle('on')};cal.onclick=e=>e.stopPropagation();document.addEventListener('click',()=>cal.classList.remove('on'));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.p).classList.add('on')});
(async()=>{try{await loadProfile();const q=new URLSearchParams(location.search).get('date');currentDate=profile.available_dates.includes(q)?q:profile.available_dates[profile.available_dates.length-1];currentData=allData[currentDate];render()}catch(e){document.getElementById('overview').innerHTML='<div class="card">数据加载失败，请刷新页面。</div>';console.error(e)}})();
</script></body></html>
